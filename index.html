<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <!--vite-head-->
    <script>
      // Applies the saved theme before the first paint so there is no flash.
      // This is the client-side equivalent of next-themes' inline script
      // (which is disabled in src/context/ThemeProviderContext.tsx).
      (function () {
        try {
          var stored = window.localStorage.getItem("maurel-theme");
          var theme = stored === "dark" || stored === "light" ? stored : "light";
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (error) {
          /* ignore private-mode / storage errors */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
